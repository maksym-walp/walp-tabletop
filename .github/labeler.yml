"service: auth":
  - any:
      - "services/auth-service/**/*"

"service: spell":
  - any:
      - "services/spell-service/**/*"

"service: gateway":
  - any:
      - "gateway/**/*"

"app: web":
  - any:
      - "web/**/*"

"infrastructure":
  - any:
      - "docker-compose*.yml"
      - ".github/workflows/**/*"
      - "infrastructure/**/*"

"documentation":
  - any:
      - "**/*.md"
      - "docs/**/*"

"dependencies":
  - any:
      - "**/package.json"
      - "**/package-lock.json"

"security":
  - any:
      - "**/.env.example"
      - "**/secrets/**/*"

"database":
  - any:
      - "infrastructure/db/**/*"
      - "**/migrations/**/*"

"ci/cd":
  - any:
      - ".github/workflows/**/*"
