name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" 2>/dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 1
          done
          exit 1

      - name: Run Auth Service Tests
        run: npm run test:auth
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: test_db

      - name: Run Spell Service Tests
        run: npm run test:spell
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key
          SPELLS_DB_HOST: 127.0.0.1
          SPELLS_DB_PORT: 3306
          SPELLS_DB_USER: root
          SPELLS_DB_PASSWORD: root
          SPELLS_DB_NAME: test_db

      - name: Run Gateway Service Tests
        run: npm run test:gateway
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key
          PORT: 3000
          AUTH_SERVICE_URL: http://localhost:3001
          SPELL_SERVICE_URL: http://localhost:3002

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-${{ matrix.node-version }}
          path: |
            services/auth-service/coverage
            services/spell-service/coverage
            gateway/coverage
          retention-days: 30

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint all services
        run: npm run lint --if-present
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all services
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            services/auth-service/dist
            services/spell-service/dist
            gateway/dist
            web/build
          retention-days: 7

  integration-test:
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: integration_test_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: integration_test_db
          SPELLS_DB_HOST: 127.0.0.1
          SPELLS_DB_PORT: 3306
          SPELLS_DB_USER: root
          SPELLS_DB_PASSWORD: root
          SPELLS_DB_NAME: integration_test_db

      - name: Generate coverage report
        if: always()
        run: npm run test:coverage 2>/dev/null || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: docker compose build
        env:
          NODE_ENV: production
